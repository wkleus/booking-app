server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Reverse proxy: forward /api/* to "api" service on internal
    # Docker network (-> docker-compose.yml). Keeps frontend calling a
    # same-origin "/api" path, no CORS/hardcoded host needed at runtime
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any unknown path serves index.html so client-side
    # routing (React) can take over instead of nginx returning 404
    location / {
        try_files $uri /index.html;
    }
}